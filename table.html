<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        main{
            margin: 20px auto;
            text-align: center;
        }
        table{
            border-collapse: collapse;
            margin: 20px auto;
        }
        td, th {
            border: 1px solid black;
            padding: 10px 20px;
        }
        ul{
            list-style: none;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h2>Hello world</h2>
            <table>
                <caption>My friend collection</caption>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>First name</th>
                        <th>Last name</th>
                        <th>Age</th>
                    </tr>

                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Mahfuz</td>
                        <td>mahfuz</td>
                        <td>19</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Saif khan</td>
                        <td>saif</td>
                        <td>19</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Shihab khan</td>
                        <td>shihab</td>
                        <td>19</td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>Emon ali</td>
                        <td>emon</td>
                        <td>19</td>
                    </tr>
                    

                </tbody>
                <tfoot>
                    <td colspan="3">Total friends</td>
                    <td><b>4</b></td>

                </tfoot>
            </table>

        </section>
        <section>
            <h2>all tag</h2>
            <ul>
                <li>table=table</li>
                <li>table head=thead</li>
                <li>table body=tbody</li>
                <li>table row=tr</li>
                <li>table data=td</li>
                <li>table head=th</li>
            </ul>
        </section>
    </main>
</body>
</html>
